<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>ApuraBrasil</title>
  <desc>Logo do ApuraBrasil, plataforma de acompanhamento de resultados eleitorais.</desc>

  <defs>
    <linearGradient id="g1" x1="70" y1="65" x2="245" y2="245" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16A34A"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="g2" x1="118" y1="110" x2="210" y2="215" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Símbolo -->
  <g transform="translate(34 20)">
    <!-- base arredondada -->
    <rect x="26" y="26" width="232" height="232" rx="58" fill="#F8FAFC"/>
    <rect x="26.75" y="26.75" width="230.5" height="230.5" rx="57.25" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- losango inspirado no Brasil, sem reproduzir bandeira -->
    <path d="M142 54L226 142L142 230L58 142L142 54Z" fill="url(#g1)"/>

    <!-- círculo central -->
    <circle cx="142" cy="142" r="50" fill="url(#g2)"/>

    <!-- barras de apuração -->
    <rect x="111" y="145" width="12" height="23" rx="6" fill="white" opacity="0.95"/>
    <rect x="136" y="128" width="12" height="40" rx="6" fill="white" opacity="0.95"/>
    <rect x="161" y="107" width="12" height="61" rx="6" fill="white" opacity="0.95"/>

    <!-- check -->
    <path d="M109 126L127 143L160 109" stroke="#FACC15" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(338 0)">
    <text x="0" y="168"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
      font-size="86"
      font-weight="800"
      letter-spacing="-4"
      fill="#0F172A">Apura</text>

    <text x="247" y="168"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
      font-size="86"
      font-weight="800"
      letter-spacing="-4"
      fill="#15803D">Brasil</text>

    <text x="4" y="213"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
      font-size="24"
      font-weight="600"
      letter-spacing="2.4"
      fill="#64748B">RESULTADOS ELEITORAIS EM TEMPO REAL</text>
  </g>
</svg>
